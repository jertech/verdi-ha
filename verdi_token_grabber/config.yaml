# SPDX-License-Identifier: GPL-3.0-or-later
name: Verdi Token Grabber
version: "0.5.6"
slug: verdi_token_grabber
description: >-
  Unofficial, not affiliated with Cevi or Verdi, not for operational use, uses your
  own Verdi account and its permissions, use at your own risk.
url: https://github.com/jertech/verdi-ha
image: ghcr.io/jertech/verdi-ha-token-grabber
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
homeassistant_api: true
map:
  - type: app_config
    read_only: false
options:
  verdi_url: ""
  tenant: ""
  culture: nl
schema:
  verdi_url: url
  tenant: str
  culture: list(nl|fr|en)
  entry_id: str?
