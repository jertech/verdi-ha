add_exception:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: verdi
    status:
      required: true
      example: "Urgent"
      selector:
        text:
    duration:
      default: "5m"
      selector:
        select:
          translation_key: duration
          options: ["5m", "10m", "15m", "20m", "30m", "45m", "1h", "2h", "4h", "6h", "8h", "9h", "10h", "11h", "12h", "13h", "1d", "1d1h", "unlimited"]
return_to_planning:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: verdi
add_event:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: verdi
    status:
      required: true
      example: "Urgent"
      selector:
        text:
    start:
      required: true
      selector:
        datetime:
    end:
      required: true
      selector:
        datetime:
    calendar:
      example: "general"
      selector:
        text:
delete_event:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: verdi
    event_id:
      required: true
      selector:
        text:
