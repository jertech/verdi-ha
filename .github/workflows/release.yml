# Runs when a GitHub Release is published: checks the tag and publishes the app image to GHCR.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  app-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag equals versions
        run: python3 scripts/check_version.py "${GITHUB_REF_NAME}"
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: verdi_token_relay
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ghcr.io/jertech/verdi-ha-token-relay:${{ steps.version.outputs.version }}
          labels: |
            io.hass.name=Verdi Token Relay
            io.hass.version=${{ steps.version.outputs.version }}
            io.hass.type=addon
