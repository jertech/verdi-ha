# Runs when a GitHub Release is published: checks that the tag equals the integration's version.
# The app has its own version; its image is published by app-image.yml when the app changes.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag equals the integration's version
        run: python3 scripts/check_version.py "${GITHUB_REF_NAME}"
