# Publishes the app image to GHCR when the app changes on main, tagged with the app's own version
# (verdi_token_relay/config.yaml). A version that is already published is never rebuilt or overwritten.
name: App image

on:
  push:
    branches: [main]
    paths:
      - "verdi_token_relay/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-image
  cancel-in-progress: false

jobs:
  app-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Versions match
        run: python3 scripts/check_version.py
      - id: version
        name: App version, and whether its image exists
        run: |
          version="$(python3 scripts/check_version.py --app)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "ghcr.io/jertech/verdi-ha-token-relay:${version}" > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "ghcr.io/jertech/verdi-ha-token-relay:${version} already exists; nothing to do."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.published == 'false'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - if: steps.version.outputs.published == 'false'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.version.outputs.published == 'false'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.version.outputs.published == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: verdi_token_relay
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ghcr.io/jertech/verdi-ha-token-relay:${{ steps.version.outputs.version }}
          labels: |
            io.hass.name=Verdi Token Relay
            io.hass.version=${{ steps.version.outputs.version }}
            io.hass.type=addon
