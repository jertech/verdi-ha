name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Do not include tokens, IDs, addresses, tenant names or people's names.
        Note: the integration only reads what your own Verdi account can see, and only changes your own
        status and planning, when you switch that on.
  - type: textarea
    id: idea
    attributes:
      label: What would you like, and why?
    validations:
      required: true
