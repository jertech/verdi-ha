name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Before you post: remove all personal and account data.** This issue is public.
        Never include tokens, `verdi_state.json`, HAR files, screenshots of the browser's network tab,
        Verdi IDs (GUIDs), your Verdi address or tenant, or anyone's name.
        Replace them with placeholders like `<GUID>` or `<name>`.
  - type: checkboxes
    id: redacted
    attributes:
      label: Redaction
      options:
        - label: I removed tokens, GUIDs, addresses, tenant names and people's names from everything below.
          required: true
  - type: input
    id: version
    attributes:
      label: Integration version
      description: Settings > Devices & services > Verdi (unofficial).
      placeholder: "0.18.3"
    validations:
      required: true
  - type: input
    id: relay
    attributes:
      label: Token Relay version
      description: The app's version, or "standalone" with the image tag, or "none".
      placeholder: "1.0.0"
  - type: input
    id: ha
    attributes:
      label: Home Assistant version and installation type
      placeholder: "2026.11.0, Home Assistant OS"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines (redacted)
      render: text
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (optional)
      description: >-
        Settings > Devices & services > Verdi (unofficial) > the three dots > Download diagnostics.
        Identifiers are removed, but read it through before you paste it.
      render: json
